name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-dev.txt') }}

      - name: Install & debug Python environment
        run: |
          python -V
          python -m pip --version
          python -m pip install --upgrade pip setuptools wheel
          # Install runtime requirements first, then dev requirements
          for i in 1 2 3; do
            python -m pip install -r requirements.txt && break || sleep 5
          done
          for i in 1 2 3; do
            python -m pip install -r requirements-dev.txt && break || sleep 5
          done
          python -m pip list
          which ruff || true
          ruff --version || true

      - name: Run Linter (Ruff)
        run: |
          ruff check .

      - name: Run Tests (Pytest)
        run: |
          pytest -v