services:
  init:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./credit_copilot.db:/app/credit_copilot.db
    command: >
      sh -c "alembic upgrade head && python -m src.cli seed-users"

  api:
    build: .
    container_name: credit_copilot_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./credit_copilot.db:/app/credit_copilot.db
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  seed:
    build: .
    container_name: credit_copilot_seed
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./credit_copilot.db:/app/credit_copilot.db
    command: python -m src.cli seed-policy
    profiles:
      - seed
    depends_on:
      init:
        condition: service_completed_successfully
