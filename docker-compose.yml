version: "3.9"

services:
  api:
    build: .
    container_name: credit_copilot_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./credit_copilot.db:/app/credit_copilot.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  seed:
    build: .
    container_name: credit_copilot_seed
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: >
      python -c "
      import sys; sys.path.insert(0, '.');
      from src.infrastructure.ingestion.pipeline import ingest_documents;
      runs = [
      (['data/policy/circular-2024-07.md', 'data/policy/credit-policy-2024.pdf'], '2024'),
      (['data/policy/circular-2025-02.md', 'data/policy/credit-policy-2025.pdf'], '2025'),
      (['data/policy/product-sheet-personal-loan.md', 'data/policy/pricing-table.csv', 'data/policy/credit-procedures-manual.pdf'], None),
      ];
      [print(ingest_documents(f, policy_edition=e)) for f, e in runs]
      "
    profiles:
      - seed
    depends_on:
      - api
