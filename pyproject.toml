[tool.poetry]
name = "credit-copilot-lite"
version = "0.1.0"
description = "Credit Copilot Lite - RAG assistant boilerplate"
authors = ["Dev <dev@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = "^0.141.1"
uvicorn = "^0.54.0"
alembic = "==1.20.0"
pyjwt = "2.12.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.8"
pytest = "^9.1.1"
httpx = "0.28.1"

[tool.ruff]
line-length = 88
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
