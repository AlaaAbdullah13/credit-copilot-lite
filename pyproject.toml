[tool.poetry]
name = "credit-copilot-lite"
version = "0.1.0"
description = "Credit Copilot Lite - RAG assistant boilerplate"
authors = ["Dev <dev@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.8"
pytest = "^9.1.1"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"